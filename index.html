<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API TCG — Documentation</title>
    <meta
      name="description"
      content="API TCG Developer Documentation — card data for the most popular Trading Card Games (One Piece, Pokémon, Dragon Ball Fusion, Digimon, Union Arena, Gundam, Star Wars Unlimited, Riftbound and more)." />
    <link rel="icon" href="./favicon.ico" />
    <style>
      body {
        margin: 0;
      }
      .site-footer {
        background: #242526;
        color: #ebedf0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 2rem 1.5rem;
      }
      /* Logo en la parte superior del sidebar (lo inserta el script de abajo). */
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
      }
      .apitcg-brand-logo {
        height: 1.4rem;
        width: auto;
        flex-shrink: 0;
      }
      /* El logo es negro: invertirlo cuando Scalar está en modo oscuro */
      .dark-mode .apitcg-brand-logo {
        filter: invert(1);
      }
      .site-footer__brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 1.75rem;
      }
      .site-footer__brand img {
        height: 2.25rem;
        filter: invert(1); /* logo negro → blanco sobre el footer oscuro */
      }
      .site-footer__brand span {
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
      }
      .site-footer__links {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem 4rem;
        justify-content: center;
        max-width: 60rem;
        margin: 0 auto;
      }
      .site-footer__col h4 {
        margin: 0 0 0.75rem;
        font-size: 0.95rem;
        color: #fff;
      }
      .site-footer__col ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .site-footer__col li {
        margin-bottom: 0.5rem;
      }
      .site-footer__col a {
        color: #ebedf0;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .site-footer__col a:hover {
        text-decoration: underline;
      }
      .site-footer__copyright {
        margin: 2rem auto 0;
        text-align: center;
        font-size: 0.85rem;
        color: #ebedf0;
        max-width: 60rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Load the Scalar API Reference standalone bundle from the CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

    <!-- Render the reference from ./openapi.json -->
    <script type="text/javascript">
      Scalar.createApiReference('#app', {
        url: './openapi.json',
        // agent.disabled oculta el botón "Ask AI" (requiere el backend de
        // pago de Scalar; sin él, el botón no funcionaría en producción).
        agent: { disabled: true },
        theme: 'purple',
        // Los schemas siguen alimentando los ejemplos de respuesta de cada
        // endpoint, pero no se muestra la sección "Models" con los modelos.
        hideModels: true,
        // Preselecciona x-api-key en el panel de autenticación
        authentication: {
          preferredSecurityScheme: 'apiKey',
        },
        // Show requests as curl by default (matches the x-api-key examples)
        defaultHttpClient: {
          targetKey: 'shell',
          clientKey: 'curl',
        },
        metaData: {
          title: 'API TCG — Documentation',
          description: 'Card data for the most popular Trading Card Games.',
        },
      })
    </script>

    <!-- Footer (same links as the previous docs site) -->
    <footer class="site-footer">
      <div class="site-footer__brand">
        <img src="./logo.svg" alt="API TCG logo" />
        <span>API TCG</span>
      </div>
      <div class="site-footer__links">
        <div class="site-footer__col">
          <h4>Docs</h4>
          <ul>
            <li><a href="#">Introduction</a></li>
            <li><a href="#description/authentication">Authentication</a></li>
            <li><a href="#tag/products">API Reference</a></li>
            <li><a href="#description/showcase">Showcase</a></li>
            <li><a href="#description/questions">Questions</a></li>
          </ul>
        </div>
        <div class="site-footer__col">
          <h4>Community</h4>
          <ul>
            <li><a href="https://discord.gg/EkxEKGJzRg" target="_blank" rel="noopener">Discord</a></li>
            <li><a href="https://github.com/apitcg" target="_blank" rel="noopener">Github</a></li>
          </ul>
        </div>
        <div class="site-footer__col">
          <h4>More</h4>
          <ul>
            <li><a href="https://apitcg.com/platform" target="_blank" rel="noopener">Developer Platform</a></li>
          </ul>
        </div>
      </div>
      <p class="site-footer__copyright">
        Copyright © <span id="footer-year"></span> API TCG, This website is not
        created, sponsored, nor is it an official product of Bandai or Nintendo.
      </p>
    </footer>
    <script>
      document.getElementById('footer-year').textContent = new Date().getFullYear()

      // Scalar no tiene opción nativa de logo: lo insertamos arriba del sidebar
      // cuando termina de renderizar. El observador queda activo para
      // re-aplicarlo si Scalar re-renderiza. Si la estructura cambiara en el
      // futuro, no hace nada (la página sigue funcionando sin logo).
      const addSidebarLogo = () => {
        if (document.querySelector('.apitcg-brand-logo')) return
        const sidebar = document.querySelector('.sidebar')
        if (!sidebar) return
        let header = sidebar.querySelector('.sidebar-header')
        if (!header) {
          header = document.createElement('div')
          header.className = 'sidebar-header'
          sidebar.prepend(header)
        }
        const img = document.createElement('img')
        img.src = './logo.svg'
        img.alt = 'API TCG'
        img.className = 'apitcg-brand-logo'
        header.append(img)
      }
      new MutationObserver(addSidebarLogo).observe(
        document.getElementById('app'),
        { childList: true, subtree: true },
      )
    </script>
  </body>
</html>
